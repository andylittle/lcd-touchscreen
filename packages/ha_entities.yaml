# Home Assistant state mirrored into the panel. One block per dashboard card.
# Requires the device to be added to HA; state arrives over the native API.

binary_sensor:
  - platform: homeassistant
    id: st_light_1
    entity_id: ${light_1}
    on_state:
      - lvgl.widget.update:
          id: btn_light_1
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: st_light_2
    entity_id: ${light_2}
    on_state:
      - lvgl.widget.update:
          id: btn_light_2
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: st_light_3
    entity_id: ${light_3}
    on_state:
      - lvgl.widget.update:
          id: btn_light_3
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: st_light_4
    entity_id: ${light_4}
    on_state:
      - lvgl.widget.update:
          id: btn_light_4
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: st_switch_1
    entity_id: ${switch_1}
    on_state:
      - lvgl.widget.update:
          id: btn_switch_1
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: st_switch_2
    entity_id: ${switch_2}
    on_state:
      - lvgl.widget.update:
          id: btn_switch_2
          state:
            checked: !lambda return x;
  - platform: homeassistant
    id: st_switch_3
    entity_id: ${switch_3}
    on_state:
      - lvgl.widget.update:
          id: btn_switch_3
          state:
