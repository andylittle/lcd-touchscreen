# Guition JC8012P4A1C (v3 / batch 2635) - Home Assistant wall panel
# Entry point. Build:  .venv/bin/esphome run panel.yaml [--device /dev/ttyACM0]
substitutions:
  name: lcd-panel
  friendly_name: LCD Panel
  room: Living Room

  # ---- Home Assistant entities shown on the dashboard ----
  # Picked from HA on 2026-09-18 (HA at 192.168.1.212:8123). Keep every entity here so
  # re-targeting a card is a one-line change. Names are the card labels.
  light_1: light.living_room_lamp_one
  light_1_name: LR Lamp One
  light_2: light.living_room_lamp_two
  light_2_name: LR Lamp Two
  light_3: light.porch_light
  light_3_name: Porch Light
  light_4: light.light_upstairs_hall_fe04b14c_10
  light_4_name: Hall Light
  switch_1: switch.lr_lamps
  switch_1_name: LR Lamps
  switch_2: switch.landscape_lights
  switch_2_name: Landscape
  switch_3: switch.yard_light
  switch_3_name: Yard Light
  switch_4: switch.tasmota_plug14
  switch_4_name: Hall Fan
  climate_main: climate.downstairs
  climate_name: Downstairs
  temp_unit: "°F"
  temp_step: "1"

packages:
  hardware:    !include packages/hardware.yaml
  core:        !include packages/core.yaml
  c6_update:   !include packages/c6_update.yaml
  ha_entities: !include packages/ha_entities.yaml
  lvgl_theme:  !include packages/lvgl_theme.yaml
  lvgl_pages:  !include packages/lvgl_pages.yaml
